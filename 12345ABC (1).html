<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Jade Monkey Lounge 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: full-bleed 3D canvas, a slim name bar on top, view chips docked at the bottom. Single dark "jade night" look by choice. */
:root{
  --ink:#0e1a17;        /* scene backdrop / bars */
  --panel:#15241f;      /* chip ground */
  --line:#2a3d36;       /* hairlines */
  --text:#e6efe9;       /* primary text */
  --muted:#93a89f;      /* secondary text */
  --jade:#4fbf93;       /* accent */
  --display:"Big Shoulders Display","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);margin:0;overflow:hidden}
#app{position:relative;height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:1.45rem;letter-spacing:.04em;margin:0;text-transform:uppercase;line-height:1}
h1 span{color:var(--jade)}
.meta{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.02em}
#stage{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.dock{display:flex;flex-direction:column;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
button{font:500 .8rem/1 var(--body);color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;white-space:nowrap;cursor:pointer}
button[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--ink)}
button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.tog{font-family:var(--mono);font-size:.72rem}
.hint{position:absolute;left:16px;bottom:10px;font-family:var(--mono);font-size:.68rem;color:var(--muted);pointer-events:none;background:color-mix(in srgb,var(--ink) 70%,transparent);padding:4px 8px;border-radius:4px}
.scale{position:absolute;right:16px;top:10px;font-family:var(--mono);font-size:.68rem;color:var(--muted);text-align:right;pointer-events:none;line-height:1.5}
</style>

<div id="app">
  <header>
    <h1>Jade <span>Monkey</span> Lounge</h1>
    <div class="meta">1 Woodbrook Place, St James</div>
  </header>
  <div id="stage">
    <canvas id="c" aria-label="3D model of the Jade Monkey lounge"></canvas>
    <div class="scale">Built to drawing dimensions<br>Roof 50'-3" x 11'-0" · Walls 8'-4"</div>
    <div class="hint" id="hint">Drag to orbit · pinch to zoom</div>
  </div>
  <div class="dock">
    <div class="row" role="group" aria-label="Camera views">
      <button id="v-overview" aria-pressed="true">Overview</button>
      <button id="v-street">From the street</button>
      <button id="v-walk">Walkthrough</button>
      <button id="v-bar">Lounge bar</button>
      <button id="v-bartender">Bartender's view</button>
      <button id="v-smoking">Smoking area</button>
      <button id="v-tv">TV wall</button>
      <button id="v-wormN">Worm's eye: street corner</button>
      <button id="v-wormS">Worm's eye: south corner</button>
      <button id="v-roof">Roof framing</button>
    </div>
    <div class="row" role="group" aria-label="Show or hide">
      <button class="tog" id="t-roof" aria-pressed="true">Polycarbonate roof</button>
      <button class="tog" id="t-wall" aria-pressed="true">CNC screen wall</button>
      <button class="tog" id="t-club" aria-pressed="true">Club building</button>
      <button class="tog" id="t-string" aria-pressed="true">String lights</button>
      <button class="tog" id="t-furn" aria-pressed="true">Tables &amp; chairs</button>
      <button class="tog" id="t-sails" aria-pressed="true">Shade sails</button>
      <button class="tog" id="t-slots" aria-pressed="true">Slot machines</button>
      <button class="tog" id="t-tv" aria-pressed="true">TV screens</button>
      <button class="tog" id="t-night" aria-pressed="false">Night</button>
      <button class="tog" id="t-shut" aria-pressed="false">Close bar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const canvas=document.getElementById('c'), stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xa9c6db);
scene.fog=new THREE.Fog(0xa9c6db,160,340);
const camera=new THREE.PerspectiveCamera(45,1,0.3,800);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.maxPolarAngle=Math.PI*0.495; controls.minDistance=3; controls.maxDistance=200;

// ---------- lighting (late-afternoon Trinidad sun) ----------
const hemi=new THREE.HemisphereLight(0xdbe9f2,0x6b5a45,0.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffe2b8,1.35);
sun.position.set(55,70,30); sun.target.position.set(8,0,28);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:10,far:220});
sun.shadow.bias=-0.0004; scene.add(sun,sun.target);
function warm(x,y,z,i){const l=new THREE.PointLight(0xffc27a,i,18,2);l.position.set(x,y,z);scene.add(l);
  const b=new THREE.Mesh(new THREE.SphereGeometry(0.22,16,12),new THREE.MeshBasicMaterial({color:0xffd9a0}));b.position.copy(l.position);scene.add(b);
  const cord=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.9,6),new THREE.MeshBasicMaterial({color:0x222222}));cord.position.set(x,y+0.55,z);scene.add(cord);}
[[5,6.9,41],[5,6.9,45.5],[5,6.9,49],[5,6.9,6],[5,6.9,14],[5,6.9,20]].forEach(p=>warm(p[0],p[1],p[2],0.9));

// ---------- procedural textures ----------
function tex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
function rnd(s){return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;}}
const R=rnd(7);
const woodTex=tex(512,512,(g,w,h)=>{const rows=8;for(let i=0;i<rows;i++){const y=i*h/rows;
  const base=[150+R()*22,122+R()*16,92+R()*12];g.fillStyle=`rgb(${base.map(Math.round)})`;g.fillRect(0,y,w,h/rows);
  for(let k=0;k<40;k++){g.strokeStyle=`rgba(60,35,18,${0.05+R()*0.08})`;g.beginPath();const yy=y+R()*h/rows;g.moveTo(0,yy);g.bezierCurveTo(w*.3,yy+R()*6-3,w*.7,yy+R()*6-3,w,yy);g.stroke();}
  g.fillStyle='rgba(30,18,10,.55)';g.fillRect(0,y,w,3);const cut=R()*w;g.fillRect(cut,y,3,h/rows);}},[1,1]);
const barWoodTex=tex(512,512,(g,w,h)=>{g.fillStyle='rgb(98,64,40)';g.fillRect(0,0,w,h);const r=rnd(21);
  for(let k=0;k<160;k++){g.strokeStyle=`rgba(40,24,12,${0.08+r()*0.10})`;g.lineWidth=1+r()*1.5;g.beginPath();const y=r()*h;g.moveTo(0,y);g.bezierCurveTo(w*.3,y+r()*8-4,w*.7,y+r()*8-4,w,y);g.stroke();}},[1,1]);
const boardTex=tex(256,256,(g,w,h)=>{g.fillStyle='#d9d4c8';g.fillRect(0,0,w,h);for(let i=0;i<5000;i++){const v=R();g.fillStyle=`rgba(${v>.5?255:120},${v>.5?255:115},${v>.5?250:105},.08)`;g.fillRect(R()*w,R()*h,1.4,1.4);}},[3,1]);
const blockTex=tex(256,256,(g,w,h)=>{g.fillStyle='#cfc7b4';g.fillRect(0,0,w,h);for(let i=0;i<3000;i++){g.fillStyle=`rgba(90,80,60,${R()*0.07})`;g.fillRect(R()*w,R()*h,2,2);}},[6,2]);
const concTex=tex(256,256,(g,w,h)=>{g.fillStyle='#8f8b84';g.fillRect(0,0,w,h);for(let i=0;i<6000;i++){g.fillStyle=`rgba(${R()>.5?200:40},${R()>.5?200:40},${R()>.5?195:40},.06)`;g.fillRect(R()*w,R()*h,1.5,1.5);}
  g.strokeStyle='rgba(50,50,50,.35)';g.lineWidth=2;g.strokeRect(0,0,w,h);},[1,1]);
const polyTex=tex(64,64,(g,w,h)=>{g.fillStyle='#ffffff';g.fillRect(0,0,w,h);g.fillStyle='#bfc9c4';g.fillRect(0,0,w,6);g.fillRect(0,30,w,3);},[1,38]);
// living wall: dense leaves with red and yellow flowers (per rendering)
const leafTex=tex(512,512,(g,w,h)=>{g.fillStyle='#1f3b1c';g.fillRect(0,0,w,h);const r=rnd(11);
  for(let i=0;i<2600;i++){const x=r()*w,y=r()*h,l=6+r()*12,a=r()*Math.PI;const gr=70+r()*90;
    g.fillStyle=`rgb(${30+r()*40|0},${gr|0},${25+r()*30|0})`;g.beginPath();g.ellipse(x,y,l,l*0.45,a,0,Math.PI*2);g.fill();}
  for(let i=0;i<260;i++){const x=r()*w,y=r()*h;g.fillStyle=r()>.35?`rgb(${220+r()*35|0},${50+r()*40|0},30)`:`rgb(240,${200+r()*40|0},40)`;g.beginPath();g.arc(x,y,2+r()*3,0,Math.PI*2);g.fill();}},[3,1]);
const hedgeTex=tex(512,512,(g,w,h)=>{g.fillStyle='#1d3a1a';g.fillRect(0,0,w,h);const r=rnd(17);
  for(let i=0;i<3200;i++){const x=r()*w,y=r()*h,l=5+r()*9,a=r()*Math.PI;g.fillStyle=`rgb(${25+r()*35|0},${60+r()*80|0},${22+r()*25|0})`;g.beginPath();g.ellipse(x,y,l,l*0.5,a,0,Math.PI*2);g.fill();}},[6,1]);
// CNC screen: white = solid plate, black = cut-out (used as alpha map)
const cncTex=(()=>{const c=document.createElement('canvas');c.width=256;c.height=384;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,256,384);
  const r=rnd(42);g.fillStyle='#000';
  for(let i=0;i<70;i++){const cx=14+r()*228,cy=14+r()*356,s=8+r()*20,a=r()*Math.PI*2;g.beginPath();
    for(let k=0;k<3;k++){const aa=a+k*2.1+r()*0.5;g.lineTo(cx+Math.cos(aa)*s*(0.6+r()*0.6),cy+Math.sin(aa)*s*(0.6+r()*0.6));}g.closePath();g.fill();}
  g.strokeStyle='#fff';g.lineWidth=5;for(let i=0;i<9;i++){g.beginPath();g.moveTo(r()*256,0);g.lineTo(r()*256,384);g.stroke();}
  g.lineWidth=10;g.strokeRect(0,0,256,384);
  const d=g.getImageData(0,0,256,384),px=d.data;
  for(let i=0;i<px.length;i+=4){const a=px[i];px[i]=24;px[i+1]=26;px[i+2]=25;px[i+3]=a;}
  g.putImageData(d,0,0);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;})();

// ---------- materials ----------
const M={
  wood:new THREE.MeshStandardMaterial({map:woodTex,color:0xb4aca4,roughness:.38}),   // decking: two shades darker, light sheen
  board:new THREE.MeshStandardMaterial({map:boardTex,color:0xf2efe8,roughness:.92}),
  block:new THREE.MeshStandardMaterial({map:blockTex,color:0xf4efe6,roughness:.95}),
  render:new THREE.MeshStandardMaterial({color:0xf1eee8,roughness:.9}),
  oak:new THREE.MeshStandardMaterial({map:barWoodTex,roughness:.55}),
  black:new THREE.MeshStandardMaterial({color:0x141414,roughness:.45,metalness:.3}),
  glow:new THREE.MeshStandardMaterial({color:0xfff6e8,emissive:0xffe6c0,emissiveIntensity:.75,roughness:.6}),
  led:new THREE.MeshBasicMaterial({color:0xffd9a0}),
  leaves:new THREE.MeshStandardMaterial({map:leafTex,roughness:.85}),
  lattice:new THREE.MeshStandardMaterial({color:0xfafafa,roughness:.6}),
  conc:new THREE.MeshStandardMaterial({map:concTex,roughness:1}),
  steel:new THREE.MeshStandardMaterial({color:0x161616,roughness:.45,metalness:.6}),
  alu:new THREE.MeshStandardMaterial({color:0xbfc5c8,roughness:.35,metalness:.85}),
  poly:new THREE.MeshPhysicalMaterial({color:0xd9efe6,map:polyTex,transparent:true,opacity:.38,roughness:.15,metalness:0,side:THREE.DoubleSide,depthWrite:false}),
  pvc:new THREE.MeshStandardMaterial({color:0xf3f3f0,roughness:.5}),
  door:new THREE.MeshStandardMaterial({color:0xf3f1ec,roughness:.5}),
  doorInset:new THREE.MeshStandardMaterial({color:0xe9e6df,roughness:.5}),
  handle:new THREE.MeshStandardMaterial({color:0xc9ccce,metalness:.9,roughness:.25}),
  hdf:new THREE.MeshStandardMaterial({map:barWoodTex,roughness:.55}),
  hdfPanel:new THREE.MeshStandardMaterial({color:0x141414,roughness:.45}),
  top:new THREE.MeshStandardMaterial({color:0x2a2b2e,roughness:.22,metalness:.1}),
  backbar:new THREE.MeshStandardMaterial({map:barWoodTex,roughness:.55}),
  shadow:new THREE.MeshStandardMaterial({color:0xfff6e8,emissive:0xffe6c0,emissiveIntensity:.8,roughness:.8}),
  bottle:new THREE.MeshStandardMaterial({color:0x6aa58a,roughness:.1,metalness:.1,transparent:true,opacity:.85}),
  cnc:new THREE.MeshStandardMaterial({color:0xffffff,map:cncTex,alphaTest:.5,side:THREE.DoubleSide,roughness:.55,metalness:.3}),
  plant:new THREE.MeshStandardMaterial({color:0x3f7a3a,roughness:.9}),
  slate:new THREE.MeshStandardMaterial({color:0x4a4541,roughness:.8,metalness:.05}),
  hedge:new THREE.MeshStandardMaterial({map:hedgeTex,roughness:.95}),
  soil:new THREE.MeshStandardMaterial({color:0x3d2b1f,roughness:1}),
  club:new THREE.MeshStandardMaterial({color:0xece6db,roughness:.9}),
  glass:new THREE.MeshStandardMaterial({color:0x223035,roughness:.1,metalness:.5}),
};

const slateDoor=new THREE.MeshStandardMaterial({color:0x141618,roughness:.5}),slateInset=new THREE.MeshStandardMaterial({color:0x1c1f22,roughness:.45});   // all four doors: dark grey
function box(w,h,d,mat,x,y,z,group){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(group||scene).add(m);return m;}
const FT=1, IN=1/12;

// ---------- ground & context ----------
// Plan coordinates in feet: x east from the block wall's inner face, z south from the north end of the smoking area.
const PIT=[0,31.6,9.42,35.93];                          // stair well down to the club door (plan: 6 risers @ 7")
function holed(outer,hole){const s=new THREE.Shape(outer.map(p=>new THREE.Vector2(p[0],p[1])));
  const h=new THREE.Path([[hole[0],hole[1]],[hole[2],hole[1]],[hole[2],hole[3]],[hole[0],hole[3]]].map(p=>new THREE.Vector2(p[0],p[1])));s.holes.push(h);return s;}
(()=>{const g=new THREE.ShapeGeometry(holed([[-140,-120],[160,-120],[160,180],[-140,180]],PIT));g.rotateX(Math.PI/2);
  const uv=g.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)/10,uv.getY(i)/10);
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:concTex,roughness:1,side:THREE.DoubleSide}));m.position.y=-0.16;m.receiveShadow=true;scene.add(m);})();
const club=new THREE.Group();scene.add(club);
// club building: straight east wall, then a 45-degree chamfer running south-west from the end of the bar (site plan FD-101)
const CH_A=[0,50.84], CH_B=[-15.2,66.04];
(()=>{const s=new THREE.Shape([[-30.67,-12],[2.33,-12],[2.33,8.6],[-0.67,10.4],[-0.67,51.12],[CH_B[0]+0.25,CH_B[1]-0.7],[-30.67,CH_B[1]-0.7]].map(p=>new THREE.Vector2(p[0],p[1])));
  const g=new THREE.ExtrudeGeometry(s,{depth:15,bevelEnabled:false});g.rotateX(Math.PI/2);
  const m=new THREE.Mesh(g,M.club);m.position.y=15;m.castShadow=m.receiveShadow=true;club.add(m);})();
for(let z=13;z<46;z+=8.5){box(0.2,3.2,4,M.glass,-0.56,11,z,club);}

// existing block wall (west)
box(0.67,11,40.74,M.block,-0.335,5.5,30.47);          // z 10.1 -> 50.84
box(0.67,11,8.6,M.block,2.665,5.5,4.3);               // north leg at x=3
(()=>{const a=new THREE.Vector2(0,10.1),b=new THREE.Vector2(3,8.6);const len=a.distanceTo(b);
  const m=box(0.67,11,len+0.6,M.block,(a.x+b.x)/2-0.3,5.5,(a.y+b.y)/2);m.rotation.y=Math.atan2(b.x-a.x,b.y-a.y);})();
box(1.27,11,0.67,M.block,2.965,5.5,-0.335);            // north wall, west of the door (runs into the club building)
box(5.0,11,0.67,M.block,9.1,5.5,-0.335);                // north wall, east of the door
box(3.0,11-6.667,0.67,M.block,5.1,6.667+(11-6.667)/2,-0.335);    // lintel over the door
box(2.95,6.667,0.15,slateDoor,5.1,6.667/2,-0.12);              // 3'-0" x 6'-8" slate door (exit at the north end of the smoking room)
box(1.6,6.667*0.6,0.03,slateInset,5.1,6.667*0.55,-0.03);
box(0.45,0.06,0.08,M.handle,6.2,3.4,0.0);
(()=>{const dx=CH_B[0]-CH_A[0],dz=CH_B[1]-CH_A[1],len=Math.hypot(dx,dz),nx=-0.7071*0.335,nz=-0.7071*0.335;
  const m=box(0.67,11,len+0.5,M.block,(CH_A[0]+CH_B[0])/2+nx,5.5,(CH_A[1]+CH_B[1])/2+nz);m.rotation.y=Math.atan2(dx,dz);
  // planters on top of the walls, as in the renderings
  for(let i=0;i<18;i++){const t=i/17;const sph=new THREE.Mesh(new THREE.SphereGeometry(0.6+R()*0.5,10,8),M.plant);sph.position.set(CH_A[0]+dx*t+nx,11.3+R()*0.4,CH_A[1]+dz*t+nz);sph.castShadow=true;scene.add(sph);}})();
for(let i=0;i<30;i++){const sph=new THREE.Mesh(new THREE.SphereGeometry(0.6+R()*0.5,10,8),M.plant);sph.position.set(-0.35,11.3+R()*0.4,11+i*1.33);sph.castShadow=true;scene.add(sph);}

// ---------- timber deck (with the stair well cut out) ----------
(()=>{const s=holed([[3,0],[21.9,0],[11.6,70.53],[CH_B[0],70.53],[CH_B[0],CH_B[1]],[CH_A[0],CH_A[1]],[0,10.1],[3,8.6]],PIT);
  const g=new THREE.ExtrudeGeometry(s,{depth:0.15,bevelEnabled:false});g.rotateX(Math.PI/2);
  const uv=g.attributes.uv;for(let i=0;i<uv.count;i++){uv.setXY(i,uv.getX(i)/6,uv.getY(i)/4);}
  const m=new THREE.Mesh(g,M.wood);m.receiveShadow=true;scene.add(m);})();

// ---------- 4" concrete board partitions (8'-4" high) ----------
const H=8+4*IN, T=4*IN, DH=6+8*IN;
function wallZ(x,z0,z1){box(T,H,z1-z0,M.board,x,H/2,(z0+z1)/2);}
function lintelZ(x,z0,z1){box(T,H-DH,z1-z0,M.board,x,DH+(H-DH)/2,(z0+z1)/2);}
const EX=9.09+T/2;                                     // east partition centreline (plan x 9'-1" to 9'-5")
wallZ(EX,0,0.17); lintelZ(EX,0.17,3.17); wallZ(EX,3.17,27.0); lintelZ(EX,27.0,30.0); wallZ(EX,30.0,31.6);
box(9.09,H,T,M.board,4.545,H/2,23.25+T/2);            // cross wall smoking / storage
box(9.42,H,T,M.board,4.71,H/2,31.27+T/2);             // storage south wall
// doors 3'-0" x 6'-8"
function door(z0,z1,slate){const g=new THREE.Group();scene.add(g);const w=z1-z0;
  box(0.15,DH,w-0.05,slateDoor,EX+0.02,DH/2,(z0+z1)/2,g);
  box(0.03,DH*0.62,w*0.55,slateInset,EX+0.11,DH*0.52,(z0+z1)/2,g);
  box(0.08,0.06,0.45,M.handle,EX+0.18,3.4,z0+0.35,g);}

function glowTex(r,g,b){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
  const gr=x.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,`rgba(${r},${g},${b},0.9)`);gr.addColorStop(0.35,`rgba(${r},${g},${b},0.35)`);gr.addColorStop(1,`rgba(${r},${g},${b},0)`);

const stemCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,0),new THREE.Vector3(0.02,0.55,0),new THREE.Vector3(0,0.95,0),new THREE.Vector3(0.12,1.15,0),new THREE.Vector3(0.32,1.17,0),new THREE.Vector3(0.42,1.06,0)]);

  const g=new THREE.LatheGeometry(pts,60);const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),a=Math.atan2(z,x),t=-y/0.30;

// ---------- three triangular shade sails over the south lounge (sand fabric, D-ring corners on cables), anchored to the walls and posts ----------
const sails=new THREE.Group();scene.add(sails);
const sailMat=new THREE.MeshStandardMaterial({color:0xecd9a4,roughness:.9,side:THREE.DoubleSide});
const ringMat=new THREE.MeshStandardMaterial({color:0xcfd2d4,metalness:.9,roughness:.3});
const cableMat=new THREE.LineBasicMaterial({color:0x8a8a8a});
function sail(P){                                             // P: three anchor points [x,y,z]
  const A=P.map(p=>new THREE.Vector3(...p)),C=A[0].clone().add(A[1]).add(A[2]).multiplyScalar(1/3);
  const K=A.map(a=>a.clone().lerp(C,0.07));                  // sail corners sit ~7% in from the anchors (tensioning cable)
  const N=24,pos=[],idx=[],id=(i,j)=>i*(N+1)-(i*(i-1))/2+j;
  for(let i=0;i<=N;i++)for(let j=0;j<=N-i;j++){const a=1-(i+j)/N,b=i/N,c=j/N;
    const p=K[0].clone().multiplyScalar(a).add(K[1].clone().multiplyScalar(b)).add(K[2].clone().multiplyScalar(c));
    // concave (catenary-cut) edges: pull edge points toward the centre, most at mid-edge
    [[a,b,c,K[1],K[2]],[b,a,c,K[0],K[2]],[c,a,b,K[0],K[1]]].forEach(([w,u,v,E1,E2])=>{const s=u+v;if(s<1e-6)return;const t=v/s;
      const pull=0.07*E1.distanceTo(E2)*4*t*(1-t)*Math.pow(1-w,6);p.add(C.clone().sub(p).setY(0).normalize().multiplyScalar(pull));});
    p.y-=0.35*27*a*b*c;pos.push(p.x,p.y,p.z);}
  for(let i=0;i<N;i++)for(let j=0;j<N-i;j++){idx.push(id(i,j),id(i+1,j),id(i,j+1));if(j<N-i-1)idx.push(id(i+1,j),id(i+1,j+1),id(i,j+1));}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  const m=new THREE.Mesh(g,sailMat);m.castShadow=true;m.receiveShadow=true;sails.add(m);
  K.forEach((k,n)=>{const r=new THREE.Mesh(new THREE.TorusGeometry(0.12,0.025,8,16),ringMat);r.position.copy(k);r.lookAt(A[n]);sails.add(r);
    sails.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([k,A[n]]),cableMat));});}
// anchors sit above the string lights: club building wall at 13'-6" to 14'-2", posts raised to 14 ft (checked: at least 1'-4" over every light wire)

// ---------- smoking room: 10 slot machines (6 on the east wall, 4 on the west wall), 33" spacing, 24" deep cabinets + stools = 40" per side, 29" clear aisle ----------
const slots=new THREE.Group();scene.add(slots);
const cabMat=new THREE.MeshStandardMaterial({color:0x1a1a1f,roughness:.35,metalness:.5});
const trimMat=new THREE.MeshStandardMaterial({color:0xb8952f,roughness:.3,metalness:.9});
function screenTex(seed){const c=document.createElement('canvas');c.width=128;c.height=192;const g=c.getContext('2d');const r=rnd(seed);
  const gr=g.createLinearGradient(0,0,0,192);gr.addColorStop(0,'#2b0f5c');gr.addColorStop(1,'#0c3b6b');g.fillStyle=gr;g.fillRect(0,0,128,192);
  for(let i=0;i<3;i++)for(let j=0;j<3;j++){g.fillStyle=['#ffd23f','#ff4f6d','#3fe0a0','#4fb3ff'][(r()*4)|0];g.beginPath();g.arc(28+i*36,70+j*34,11,0,Math.PI*2);g.fill();}
  g.fillStyle='#ffd23f';g.font='bold 18px sans-serif';g.textAlign='center';g.fillText('JACKPOT',64,30);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t;}
function slot(wx,z,face,seed){                              // wx: wall face x; face: +1 faces east (west wall), -1 faces west (east wall)
  const g=new THREE.Group();g.position.set(wx+face*1.0,0,z);slots.add(g);

  const scr=new THREE.Mesh(new THREE.PlaneGeometry(2.2,2.2),new THREE.MeshStandardMaterial({map:screenTex(seed),emissive:0xffffff,emissiveMap:screenTex(seed),emissiveIntensity:.9}));

// ---------- camera views ----------
const views={

let anim=null, scan=null;
// customer walkthrough: in from the street down the two-seater strip, up to the bar, a look down the stairs, then round to the TV wall
const TOUR=[[0,[15.5,5.4,-6],[14.5,5.0,10]],[5,[15.0,5.4,4],[13.5,5.0,20]],[10,[13.6,5.4,16],[13,5.0,32]],[15,[13.2,5.4,28],[10,4.6,40]],
  [20,[13.0,5.4,37],[8,3.8,42]],[24,[12.6,5.4,41],[4,3.6,44]],[29,[13.4,5.4,40.2],[5.5,-0.8,33.8]],[33,[13.6,5.4,39.8],[5.5,-0.8,33.8]],
  [38,[12.3,5.4,47],[0,5.5,62]],[43,[9.5,5.4,52.5],[-7.6,6.4,58.4]],[48,[6.5,5.4,53.8],[-7.6,6.4,58.44]]];
const tourP=new THREE.CatmullRomCurve3(TOUR.map(k=>new THREE.Vector3(...k[1])),false,'catmullrom',0.5),tourT=new THREE.CatmullRomCurve3(TOUR.map(k=>new THREE.Vector3(...k[2])),false,'catmullrom',0.5);
let tour=null;
function tourStep(now){const T=(now-tour.s)/1000,n=TOUR.length;if(T>=TOUR[n-1][0]){tour=null;return;}
  let i=0;while(i<n-2&&T>TOUR[i+1][0])i++;const f=(T-TOUR[i][0])/(TOUR[i+1][0]-TOUR[i][0]),u=(i+f)/(n-1);
  camera.position.copy(tourP.getPoint(u));controls.target.copy(tourT.getPoint(u));}
function go(name){const v=views[name];scan=null;tour=null;controls.maxPolarAngle=(v.head||v.low)?Math.PI*0.97:Math.PI*0.495;   // low views may look up

  const p1=new THREE.Vector3(...v.p),t1=new THREE.Vector3(...v.t);
  document.querySelectorAll('[id^="v-"]').forEach(b=>b.setAttribute('aria-pressed',b.id==='v-'+name));
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){camera.position.copy(p1);controls.target.copy(t1);anim=null;scan=v.scan?{eye:p1.clone(),s:performance.now()}:null;camera.fov=v.fov||45;camera.updateProjectionMatrix();controls.minDistance=v.head?0.1:3;return;}
  anim={p0,t0,p1,t1,s:performance.now(),d:1100,scan:!!v.scan,tour:!!v.tour};
  camera.fov=v.fov||45;camera.updateProjectionMatrix();controls.minDistance=v.head?0.1:3;}

function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);resize();

function loop(now){requestAnimationFrame(loop);updateTVs(now||0);
  if(shutT!==shutGoal){setShutter(shutGoal>shutT?Math.min(shutGoal,shutT+0.012):Math.max(shutGoal,shutT-0.012));}
  if(anim){let k=Math.min(1,(now-anim.s)/anim.d);k=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(anim.p0,anim.p1,k);controls.target.lerpVectors(anim.t0,anim.t1,k);if(k>=1){if(anim.scan)scan={eye:anim.p1.clone(),s:now};if(anim.tour)tour={s:now};anim=null;}}
  if(tour)tourStep(now);
  if(scan){const a=1.05*Math.sin((now-scan.s)/14000*Math.PI*2);controls.target.set(scan.eye.x+0.6*Math.cos(a),scan.eye.y-0.07,scan.eye.z+0.6*Math.sin(a));}
  controls.update();renderer.render(scene,camera);}
requestAnimationFrame(loop);
})();
